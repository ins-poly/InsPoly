[project]
name = "inspoly"
version = "0.1.0"
description = "Batch-first Polymarket suspicious activity scanner"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[project.scripts]
inspoly = "app.cli:main"

[project.optional-dependencies]
macos-app = [
    "pyinstaller>=6.0",
    "pywebview>=5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "*.html",
    "vendor/browser/**/*",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
