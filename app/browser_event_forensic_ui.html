              <div className="section-label">Analysis time window</div>
              <div style={{display: "grid", gap: 10, marginBottom: 12}}>
                <div style={{border: "1px solid var(--border)", borderRadius: 12, padding: 10, background: "rgba(8, 17, 31, 0.42)"}}>
                  <div className="muted" style={{fontSize: 11, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", marginBottom: 7}}>Start</div>
                  <div style={{display: "grid", gridTemplateColumns: "minmax(0, 1fr) 112px", gap: 8}}>
                    <input
                      type="date"
                      value={dateTimeFilterDate(filters, "start")}
                      onChange={event => setFilters(current => updateDateTimeFilter(current, "start", "date", event.target.value))}
                      className="btn mono"
                      style={{width: "100%", minWidth: 0, paddingLeft: 10, paddingRight: 8}}
                      aria-label="Analysis start date"
                    />
                    <input
                      type="time"
                      step="60"
                      value={dateTimeFilterTime(filters, "start")}
                      onChange={event => setFilters(current => updateDateTimeFilter(current, "start", "time", event.target.value))}
                      className="btn mono"
                      style={{width: "100%", minWidth: 0, paddingLeft: 10, paddingRight: 8}}
                      aria-label="Analysis start time"
                    />
                  </div>
                </div>
                <div style={{border: "1px solid var(--border)", borderRadius: 12, padding: 10, background: "rgba(8, 17, 31, 0.42)"}}>
                  <div className="muted" style={{fontSize: 11, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", marginBottom: 7}}>End</div>
                  <div style={{display: "grid", gridTemplateColumns: "minmax(0, 1fr) 112px", gap: 8}}>
                    <input
                      type="date"
                      value={dateTimeFilterDate(filters, "end")}
                      onChange={event => setFilters(current => updateDateTimeFilter(current, "end", "date", event.target.value))}
                      className="btn mono"
                      style={{width: "100%", minWidth: 0, paddingLeft: 10, paddingRight: 8}}
                      aria-label="Analysis end date"
                    />
                    <input
                      type="time"
                      step="60"
                      value={dateTimeFilterTime(filters, "end")}
                      onChange={event => setFilters(current => updateDateTimeFilter(current, "end", "time", event.target.value))}
                      className="btn mono"
                      style={{width: "100%", minWidth: 0, paddingLeft: 10, paddingRight: 8}}
                      aria-label="Analysis end time"
                    />
                  </div>
                </div>
              </div>
              <div style={{display: "grid", gap: 8}}>
                <label className="toggle">
                  <span>
                    <div style={{fontWeight: 600}}>Include related case-family markets</div>
                    <div className="muted" style={{fontSize: 12}}>Whole event mode adds title-similar sibling events to primary rankings; Single market keeps them as enrichment only.</div>
                  </span>
                  <input type="checkbox" checked={!!filters.includeRelatedMarkets} onChange={event => setFilters(current => ({ ...current, includeRelatedMarkets: event.target.checked }))} />
                </label>
                <label className="toggle">
                  <span>
                    <div style={{fontWeight: 600}}>Include blockchain linkage</div>
                    <div className="muted" style={{fontSize: 12}}>Attach funding-link fields when available; mode below controls live tracing.</div>
                  </span>
                  <input type="checkbox" checked={!!filters.includeBlockchain} onChange={event => setFilters(current => ({ ...current, includeBlockchain: event.target.checked }))} />
                </label>
                <label className="toggle">
                  <span>
                    <div style={{fontWeight: 600}}>Funding trace mode</div>
                    <div className="muted" style={{fontSize: 12}}>Disabled keeps funding evidence unknown and does not call RPC.</div>
                  </span>
                  <select
                    value={filters.fundingTraceMode || "disabled"}
                    onChange={event => setFilters(current => ({
                      ...current,
                      fundingTraceMode: event.target.value,
                      includeBlockchain: event.target.value === "disabled" ? true : current.includeBlockchain,
                    }))}
                    className="btn"
                    style={{minWidth: 150}}
                  >
                    <option value="live_rpc">Live RPC</option>
                    <option value="cache_only">Cache only</option>
                    <option value="disabled">Disabled / no RPC</option>
                  </select>
                </label>
                <label className="toggle">
                  <span>
                    <div style={{fontWeight: 600}}>Run reviewer automatically after analysis</div>
                    <div className="muted" style={{fontSize: 12}}>Run a second-pass logic audit after the saved forensic bundle is written.</div>
                  </span>
                  <input type="checkbox" checked={!!filters.autoRunReviewer} onChange={event => setFilters(current => ({ ...current, autoRunReviewer: event.target.checked }))} />
                </label>
                <label className="toggle">
                  <span>
                    <div style={{fontWeight: 600}}>Use LLM reasoning if configured</div>
                    <div className="muted" style={{fontSize: 12}}>Advisory only; deterministic review still runs first.</div>
                  </span>
                  <input type="checkbox" checked={!!filters.useLLMReviewer} onChange={event => setFilters(current => ({ ...current, useLLMReviewer: event.target.checked }))} />
                </label>
              </div>
            </div>

            <button
              className="btn primary"
              onClick={status.running ? onStop : onAnalyze}
              style={{position: "sticky", bottom: 0, zIndex: 4, boxShadow: "0 -8px 18px rgba(8, 17, 31, 0.42)"}}
            >
              {status.running ? "Stop forensic run" : "Analyze event"}
            </button>

            <div className="panel" style={{padding: 14}}>
              <div style={{display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10}}>
                <div style={{fontSize: 15, fontWeight: 700}}>Run status</div>
                <Badge label={status.stage || "Ready"} tone={status.error ? "red" : status.running ? "cyan" : "default"} />
              </div>
              <div className="progress-track" style={{marginBottom: 10}}>
                <div className="progress-fill" style={{width: `${status.percent || 0}%`}} />
              </div>
              <div className="secondary selectable" style={{lineHeight: 1.65}}>
                {status.detail || "Ready"}
              </div>
              <div style={{marginTop: 10}}>
                <Badge
                  label={`Funding: ${report?.performance?.fundingTraceMode || report?.analysis_settings?.funding_trace_mode || filters.fundingTraceMode || "live_rpc"}`}
                  tone={(report?.performance?.fundingTraceMode || filters.fundingTraceMode) === "live_rpc" ? "cyan" : "amber"}
                />
              </div>
              {progressMetricRows(status).length > 0 && (
                <div style={{display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(120px, 1fr))", gap: 8, marginTop: 12}}>
                  {progressMetricRows(status).map(([label, value]) => (
                    <div key={label} style={{border: "1px solid var(--border)", borderRadius: 8, padding: "8px 9px", background: "rgba(255, 255, 255, 0.03)", minWidth: 0}}>
                      <div className="muted" style={{fontSize: 11, marginBottom: 3}}>{label}</div>
                      <div className="selectable" style={{fontSize: 12, fontWeight: 700, overflowWrap: "anywhere"}}>{value}</div>
                    </div>
                  ))}
                </div>
              )}
              {status.error && <div style={{marginTop: 10}}><Badge label={status.error} tone="red" /></div>}
            </div>

            <div className="panel" style={{padding: 14}}>
              <div style={{display: "flex", justifyContent: "space-between", gap: 10, alignItems: "center", marginBottom: 12}}>
                <div style={{fontSize: 15, fontWeight: 700}}>Event summary</div>
                {previewOnly
                  ? <Badge label="Preview only" tone="amber" />
                  : partialEvent
                  ? <Badge label="Partial event" tone="amber" />
                  : liveEvent
                  ? <Badge label="Live event" tone="amber" />
                  : unresolvedEvent
                  ? <Badge label="Outcome pending" tone="amber" />
                  : event
                  ? <Badge label={event.familyId || "event"} tone="cyan" />
                  : null}
              </div>
              {event ? (
                <>
                  <div className="selectable" style={{fontSize: 14, fontWeight: 600, lineHeight: 1.45, marginBottom: 10}}>{event.title}</div>
                  <div style={{display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10}}>
                    <StatTile label="Markets" value={summary?.analysis_market_count || event.analysisMarketCount || event.marketCount || 0} />
                    <StatTile label="Candidate trades" value={summary?.candidate_trade_count || 0} tone="cyan" />
                  </div>
                  <div style={{display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10}}>
                    <StatTile label="Notable trades" value={summary?.forensic_suspicious_trade_count || 0} tone="red" />
                    <StatTile label="Notable wallets" value={summary?.suspicious_wallet_count || 0} tone="amber" />
                  </div>
                  <div className="secondary selectable" style={{lineHeight: 1.65}}>
                    Analysis scope: {analysisScopeLabel(reportAnalysisScope(report))}{"\n"}
                    Selected market: {reportSelectedMarketTitle(report) || "All child markets"}{"\n"}
                    Condition ID: {reportSelectedConditionId(report) || "All child markets"}{"\n"}
                    Market slug: {reportSelectedMarketSlug(report) || "All child markets"}{"\n"}
                    Parent event slug: {reportParentEventSlug(report) || "Unknown"}{"\n"}
                    Unique wallets: {summary?.unique_wallet_count || 0}{"\n"}
                    Existing model flagged: {summary?.existing_flagged_count || 0}{"\n"}
                    Clusters: {summary?.wallet_cluster_count || 0}
                  </div>
                  {report?.scope_note ? (
                    <div className="secondary selectable" style={{lineHeight: 1.65, marginTop: 10}}>
                      {report.scope_note}
                    </div>
                  ) : null}
                  {Array.isArray(report?.evidence_warnings) && report.evidence_warnings.length ? (
                    <div className="secondary selectable" style={{lineHeight: 1.65, marginTop: 10}}>
                      Evidence warning: {report.evidence_warnings.join("\n")}
                    </div>
                  ) : null}
                  {(partialEvent || liveEvent || unresolvedEvent) && report?.eligibility?.reason ? (
                    <div className="secondary selectable" style={{lineHeight: 1.65, marginTop: 10}}>
                      {report.eligibility.reason}
                    </div>
                  ) : null}
                  <div style={{display: "flex", gap: 8, flexWrap: "wrap", marginTop: 12}}>
                    <button className="btn secondary" onClick={() => onOpenOutput("event_report_md_path")}>Open report</button>
                    <button className="btn secondary" onClick={() => onOpenOutput("model_gap_report_md_path")}>Open model QA</button>
                    {report?.export_files?.candidate_audit_md_path ? (
                      <button className="btn secondary" onClick={() => onOpenOutput("candidate_audit_md_path")}>Open candidate audit</button>
                    ) : null}
                    <button className="btn secondary" onClick={onOpenExports}>Open exports</button>
                  </div>
                </>
              ) : (
                <div className="muted" style={{lineHeight: 1.7}}>
                  Paste any Polymarket event or market link. The analyzer can run on the whole event or on one exact child market after you resolve the event and pick a condition ID.
                </div>
              )}
            </div>

            <div className="panel" style={{padding: 14}}>
              <div style={{display: "flex", justifyContent: "space-between", gap: 10, alignItems: "center", marginBottom: 10}}>
                <div style={{fontSize: 15, fontWeight: 700}}>Case Reviewer: second-pass logic audit</div>
                <Badge label={caseReview?.stage || "Idle"} tone={caseReview?.error ? "red" : caseReview?.running ? "cyan" : "default"} />
              </div>
              <div className="secondary selectable" style={{lineHeight: 1.65, marginBottom: 12}}>
                Reviews the saved forensic output for likely false positives, missing evidence, and model-improvement recommendations. It does not change scoring rules automatically.
              </div>
              <button className="btn primary" onClick={onRunCaseReviewer} disabled={!!caseReview?.running || !!status.running} style={{width: "100%", marginBottom: 12}}>
                {caseReview?.running ? "Reviewer running..." : "Run Case Reviewer"}
              </button>
              <div className="secondary selectable" style={{lineHeight: 1.65, marginBottom: 12}}>
                {caseReview?.detail || "No case review has run yet."}
              </div>
              <div style={{display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10}}>
                <StatTile label="Cases reviewed" value={reviewSummary.casesReviewed || 0} tone="cyan" />
                <StatTile label="Likely false positives" value={reviewSummary.likelyFalsePositives || 0} tone="amber" />
              </div>
              <div style={{display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10}}>
                <StatTile label="Plausible insider-style cases" value={reviewSummary.plausibleInsiderStyleCases || 0} tone="red" />
                <StatTile label="Ambiguous cases" value={reviewSummary.ambiguousCases || 0} tone="default" />
              </div>
              <div className="tile" style={{marginBottom: 10}}>
                <div className="section-label">Top suggested fixes</div>
                <div className="secondary selectable" style={{lineHeight: 1.65}}>
                  {reviewFixes.length ? reviewFixes.slice(0, 3).join("\n") : "No reviewer recommendations yet."}
                </div>
              </div>
              <div className="secondary selectable" style={{lineHeight: 1.65, marginBottom: 10}}>
                LLM review is advisory. It does not modify scoring rules.
              </div>
              <div style={{display: "flex", gap: 8, flexWrap: "wrap"}}>
                {reviewOutputs.review_report_md_path ? <button className="btn secondary" onClick={() => onOpenOutput("review_report_md_path")}>Open Review Report</button> : null}
                {reviewOutputs.model_changes_md_path ? <button className="btn secondary" onClick={() => onOpenOutput("model_changes_md_path")}>Open Model Change Recommendations</button> : null}
                {reviewOutputs.cases_json_path ? <button className="btn secondary" onClick={() => onOpenOutput("cases_json_path")}>Open Case Packets JSON</button> : null}
                {reviewOutputs.llm_review_report_md_path ? <button className="btn secondary" onClick={() => onOpenOutput("llm_review_report_md_path")}>Open LLM Review</button> : null}
              </div>
            </div>

            <div className="panel" style={{padding: 14}}>
              <div style={{fontSize: 15, fontWeight: 700, marginBottom: 10}}>Recent analyses</div>
              <div style={{display: "flex", flexDirection: "column", gap: 8}}>
                {recentRuns.length ? recentRuns.map(run => (
                  <button
                    key={run.name}
                    className="card"
                    onClick={() => onOpenRun(run.name)}
                    style={{
                      padding: 12,
                      textAlign: "left",
                      cursor: "pointer",
                      background: run.selected ? "var(--card-hover)" : "rgba(8, 17, 31, 0.6)",
                      borderColor: run.selected ? "var(--accent)" : "var(--border)",
                      color: "var(--text)",
                    }}
                  >
                    <div style={{fontSize: 13, fontWeight: 700, marginBottom: 6}}>{run.displayTime}</div>
                    <div className="secondary pretty" style={{lineHeight: 1.55}}>
                      {run.eventTitle}<br />
                      {run.tradeCount} candidate trades, {run.suspiciousTradeCount} suspicious trades<br />
                      {run.walletCount} suspicious wallets
                    </div>
                  </button>
                )) : <div className="muted">No previous forensic runs found.</div>}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function MiddleColumn({ activeTab, setActiveTab, sortMode, onSortChange, report, status, filters, setFilters, selectedId, onSelect, onNavigateEntity }) {
      const trades = report?.display_trades || report?.suspicious_trades || [];
      const wallets = report?.display_wallets || report?.suspicious_wallets || [];
      const clusters = report?.display_clusters || report?.wallet_clusters || [];
      const compatibilityNote = report?.compatibility_note || "";
      const emptyStateNote = report?.empty_state_note || "";
      const baseRows = activeTab === "wallets" ? wallets : activeTab === "clusters" ? clusters : trades;
      const rows = filterRowsForTab(activeTab, baseRows, filters);
      const sortedRows = useMemo(() => sortRowsForTab(activeTab, rows, sortMode), [activeTab, rows, sortMode]);
      const sortOptions = sortOptionsForTab(activeTab);
      const runningWithoutReport = !!status?.running && !report;
      const hiddenByTradeFilters = activeTab === "trades" ? Math.max(0, baseRows.length - rows.length) : 0;
      return (
        <div className="column panel" style={{padding: 0, overflow: "hidden"}}>
          <div style={{padding: 16, borderBottom: "1px solid var(--border)"}}>
            <div style={{display: "flex", justifyContent: "space-between", gap: 10, alignItems: "start", marginBottom: 10}}>
              <div>
                <div style={{fontSize: 17, fontWeight: 700}}>Ranked evidence</div>
                <div className="muted" style={{marginTop: 4}}>
                  {reportAnalysisScope(report) === "market"
                    ? `Primary rankings are limited to ${reportSelectedMarketTitle(report) || "the selected child market"}.`
                    : "Event-wide trade, wallet, and linked-group rankings across all wallets active in the target event."}
                </div>
              </div>
              <Badge label={`${sortedRows.length} in review list`} tone="cyan" />
            </div>
            {hiddenByTradeFilters > 0 ? (
              <div style={{display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginBottom: 10}}>
                <Badge label={`${hiddenByTradeFilters} hidden by entry filter`} tone="amber" />
                <button
                  className="mini-action"
                  onClick={() => setFilters(current => ({ ...current, maxEntryProbability: "" }))}
                >
                  Show all trade rows
                </button>
              </div>
            ) : null}
            <div style={{display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center"}}>
              <button className={`tab ${activeTab === "trades" ? "active" : ""}`} onClick={() => setActiveTab("trades")}>Trades</button>
              <button className={`tab ${activeTab === "wallets" ? "active" : ""}`} onClick={() => setActiveTab("wallets")}>Wallets</button>
              <button className={`tab ${activeTab === "clusters" ? "active" : ""}`} onClick={() => setActiveTab("clusters")}>Linked wallets</button>
              <select
                value={sortMode}
                onChange={event => onSortChange(event.target.value)}
                className="btn secondary"
                style={{marginLeft: "auto", minWidth: 200}}
              >
                {sortOptions.map(option => <option key={option.value} value={option.value}>{option.label}</option>)}
              </select>
            </div>
            {activeTab === "trades" ? (
              <div className="secondary" style={{marginTop: 8, fontSize: 12, lineHeight: 1.45}}>
                Event forensic priority = Event Forensic overlay (eventForensicScore) built from base scanner score plus event outcome, timing, repeat, linkage, and false-positive reducers. Base scanner score = shared _score_trade() score (existingModelScore). Sorting changes only loaded visible rows; it does not rerun analysis or rewrite exports.
              </div>
            ) : null}
            {report?.display_note ? (
              <div className="secondary selectable" style={{marginTop: 10, lineHeight: 1.6}}>
                {displayNoteText(report.display_note)}
              </div>
            ) : null}
            {compatibilityNote ? (
              <div className="secondary selectable" style={{marginTop: 10, lineHeight: 1.6}}>
                {compatibilityNote}
              </div>
            ) : null}
          </div>
          <div style={{overflowY: "auto", flex: 1, padding: 12}}>
            {runningWithoutReport && (
              <div className="secondary" style={{lineHeight: 1.7}}>
                Analysis is running. Ranked evidence will appear here after the event replay finishes loading wallet context and scoring the candidate trades.
              </div>
            )}
            {!runningWithoutReport && !rows.length && (
              <div className="secondary" style={{lineHeight: 1.7}}>
                {compatibilityNote || emptyStateNote || "No rows are available for this tab in the current event bundle."}
              </div>
            )}
            {activeTab === "trades" && sortedRows.map(item => (
              <div
                key={item.id}
                className="card"
                onClick={() => onSelect(item.id)}
                style={{
                  padding: 14,
                  marginBottom: 10,
                  cursor: "pointer",
                  background: selectedId === item.id ? "var(--card-hover)" : "var(--card)",
                  borderColor: selectedId === item.id ? "var(--accent)" : "var(--border)",
                }}
              >
                <div style={{display: "flex", justifyContent: "space-between", gap: 10, alignItems: "start", marginBottom: 8}}>
                  <div style={{fontSize: 14, fontWeight: 700, lineHeight: 1.45}}>
                    <EntityLink entity={marketEntity(item)} onNavigate={onNavigateEntity}>{item.market}</EntityLink>
                  </div>
                  <Badge label={concernLabel(item.eventForensicScore)} tone={item.eventForensicScore >= 70 ? "red" : item.eventForensicScore >= 55 ? "amber" : "green"} />
                </div>
                <div style={{display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10}}>
                  <Badge label={`Event concern ${item.eventForensicScore}/100`} tone="cyan" />
                  {numericValueAvailable(item.existingModelScore) ? <Badge label={`Base scanner: ${numericValue(item.existingModelScore)}/100`} /> : null}
                  {isHardEvidenceReview(item) ? <Badge label="Hard Evidence Review" tone="amber" /> : null}
                  {item.laterWon ? <Badge label="Resolved on traded side" tone="green" /> : null}
                  {(item.outcomeKnown === false || item.outcomeStatus === "unknown") ? <Badge label="Outcome pending" tone="amber" /> : null}

                  <div className="selectable secondary" style={{lineHeight: 1.75}}>
                    Scope: {analysisScopeLabel(reportAnalysisScope(report))}{"\n"}

                    Polymarket label: <EntityLink entity={walletEntity(wallet, walletAliasLabel(wallet))} onNavigate={onNavigateEntity} />{"\n"}
                    Event result: {wallet.eventResult}{"\n"}
                    Related-market trade count: {wallet.relatedMarketTradeCount}{"\n"}
                    Sibling-market context kept out of primary ranking: {wallet.otherEventMarketTrades || 0}{"\n"}
                    Wallet history: {walletQualityLabel(wallet.walletQualityStatus)}{"\n"}
                    Evidence status: {walletEvidenceLabel(wallet.primaryEvidenceStatus)}{"\n"}
                    Funding flags: {wallet.fundingFlags}{"\n"}
                    Specialist status: {wallet.specialistStatus}{"\n"}
                    Bot status: {wallet.botStatus}{"\n"}
                    Zombie status: {wallet.zombieStatus}{"\n"}
                    Public-user status: {wallet.walletPublicWhaleOrPowerUserLabel || "Not evaluated"}{"\n"}

                <div>
                  <div className="section-label">Linked-wallet group</div>
                  <div style={{fontSize: 22, fontWeight: 700}}>

                    Full group size: {cluster.walletCount || (cluster.wallets || []).length} wallet(s){"\n"}
                    Same funder: {cluster.sameFunder ? "Yes" : "No"}{"\n"}

    function App() {
      const [boot, setBoot] = useState(null);
      const [filters, setFilters] = useState({
        url: "",
        minSize: "1000",
        maxEntryProbability: "",
        startDateTime: "",
        endDateTime: "",
        includeRelatedMarkets: true,
        includeBlockchain: true,
        fundingTraceMode: "",
        analysisScope: "event",
        selectedConditionId: "",
        selectedMarketSlug: "",
        autoRunReviewer: false,
        useLLMReviewer: false,
      });
      const [activeListTab, setActiveListTab] = useState("trades");
      const [selectedId, setSelectedId] = useState(null);
      const [activeRightTab, setActiveRightTab] = useState("report");
      const [sortModes, setSortModes] = useState({
        trades: defaultSortMode("trades"),
        wallets: defaultSortMode("wallets"),
        clusters: defaultSortMode("clusters"),
      });

      async function refreshBootstrap() {
        const payload = await fetchJson("/api/bootstrap");
        if (payload.ok) {
          setBoot(payload);
          if (!filters.url && payload.filters) {
            setFilters(payload.filters);
          }
        }
      }

      useEffect(() => { refreshBootstrap(); }, []);

      useEffect(() => {
        const timer = setInterval(() => {
          if (!boot?.status?.running && !boot?.caseReview?.running) return;
          refreshBootstrap();
        }, 1600);
        return () => clearInterval(timer);
      }, [boot]);

      useEffect(() => {
        const report = boot?.currentReport;
        if (!report) return;
        const baseRows = activeListTab === "wallets"
          ? report.display_wallets || report.suspicious_wallets || []
          : activeListTab === "clusters"
          ? report.display_clusters || report.wallet_clusters || []
          : report.display_trades || report.suspicious_trades || [];
        const rows = sortRowsForTab(
          activeListTab,
          filterRowsForTab(activeListTab, baseRows, filters),
          sortModes[activeListTab]
        ).map(item =>
          activeListTab === "wallets" ? item.wallet : item.id
        );
        if (selectedId && !rows.includes(selectedId)) {
          setSelectedId(null);
        }
      }, [boot, activeListTab, selectedId, sortModes, filters]);

      function clearSelection() {
        setSelectedId(null);
        setActiveRightTab("report");
      }

      function selectRow(id) {
        setSelectedId(id);
        setActiveRightTab("report");
      }

      function changeListTab(tab) {
        setActiveListTab(tab);
        setSelectedId(null);
        setActiveRightTab("report");
      }

      function handleNavigateEntity(entity) {
        const report = boot?.currentReport;
        if (!report || !entity) return;
        const trades = report.display_trades || report.suspicious_trades || [];
        const wallets = report.display_wallets || report.suspicious_wallets || [];
        const clusters = report.display_clusters || report.wallet_clusters || [];
        if (entity.type === "wallet") {
          const address = entity.full_address || entity.wallet || "";
          const walletRow = wallets.find(item => item.wallet === address);
          if (walletRow) {
            setActiveListTab("wallets");
            setSelectedId(walletRow.wallet);
            setActiveRightTab("report");
            return;
          }
          const tradeRow = trades.find(item => item.wallet === address);
          if (tradeRow) {
            setActiveListTab("trades");
            setSelectedId(tradeRow.id);
            setActiveRightTab("report");
            return;
          }
          const clusterRow = clusters.find(item => (item.wallets || []).includes(address));
          if (clusterRow) {
            setActiveListTab("clusters");
            setSelectedId(clusterRow.id);
            setActiveRightTab("report");
          }
          return;
        }
        if (entity.type === "group") {
          const clusterRow = clusters.find(item => item.id === entity.group_id);
          if (clusterRow) {
            setActiveListTab("clusters");
            setSelectedId(clusterRow.id);
            setActiveRightTab("report");
          }
          return;
        }
        if (entity.type === "trade") {
          const tradeRow = trades.find(item => item.id === entity.trade_id);
          if (tradeRow) {
            setActiveListTab("trades");
            setSelectedId(tradeRow.id);
            setActiveRightTab("report");
          }
          return;
        }
        if (entity.type === "market" || entity.type === "condition") {
          const conditionId = entity.condition_id || "";
          const marketSlug = entity.market_slug || "";
          const tradeRow = trades.find(item =>
            (conditionId && item.conditionId === conditionId) ||
            (marketSlug && item.marketSlug === marketSlug) ||
            (!conditionId && !marketSlug && item.market === entity.label)
          );
          if (tradeRow) {
            setActiveListTab("trades");
            setSelectedId(tradeRow.id);
            setActiveRightTab("report");
          }
        }
      }

      async function handleAnalyze() {
        const payloadFilters = filters.analysisScope === "market"
          ? filters
          : { ...filters, selectedConditionId: "", selectedMarketSlug: "" };
        const payload = await postJson("/api/analyze", payloadFilters);
        if (!payload.ok) {
          alert(payload.error || "Could not start the event analysis.");
          return;
        }
        clearSelection();
        await refreshBootstrap();
      }

      async function handleResolveTarget() {
        const payload = await postJson("/api/resolve-target", {
          ...filters,
          analysisScope: "event",
          selectedConditionId: "",
          selectedMarketSlug: "",
        });
        if (!payload.ok) {
          alert(payload.error || "Could not resolve the target event.");
          return;
        }
        const resolvedTarget = payload.resolvedTarget || null;
        setBoot(current => current ? { ...current, resolvedTarget } : current);
        setFilters(current => syncFiltersWithResolvedTarget(current, resolvedTarget));
      }

      async function handleStop() {
        await postJson("/api/stop", {});
        await refreshBootstrap();
      }

      async function handleOpenRun(name) {
        const payload = await fetchJson(`/api/run?name=${encodeURIComponent(name)}`);
        if (!payload.ok) {
          alert(payload.error || "Could not load the saved run.");
          return;
        }
        setBoot(payload);
        if (payload.filters) setFilters(payload.filters);
        clearSelection();
      }

      async function handleOpenOutput(key) {
        const payload = await postJson("/api/open-output", { key });
        if (!payload.ok) {
          alert(payload.error || "Could not open the selected file.");
        }
      }

      async function handleOpenExports() {
        const payload = await postJson("/api/open-exports-dir", {});
        if (!payload.ok) {
          alert(payload.error || "Could not open the exports directory.");
        }
      }

      async function handleRunCaseReviewer() {
        const payload = await postJson("/api/run-case-reviewer", { useLlm: !!filters.useLLMReviewer });
        if (!payload.ok) {
          alert(payload.error || "Could not run the case reviewer.");
        }
        if (payload.caseReview) {
          setBoot(current => current ? { ...current, caseReview: payload.caseReview } : current);
        } else {
          await refreshBootstrap();
        }
      }

      async function handleCopy() {
        const report = boot?.currentReport;
        if (!report) return;
        let text = "";
        if (activeRightTab === "report") {
          const list = activeListTab === "wallets"
            ? report.display_wallets || report.suspicious_wallets || []
            : activeListTab === "clusters"
            ? report.display_clusters || report.wallet_clusters || []
            : report.display_trades || report.suspicious_trades || [];
          const row = activeListTab === "wallets" ? list.find(item => item.wallet === selectedId) : list.find(item => item.id === selectedId);
          text = row ? selectionCopyText(activeListTab, row) : plainTextFromMarkdown(report.event_report_markdown || "");
        }
        if (activeRightTab === "model-gap") text = plainTextFromMarkdown(report.model_gap_markdown || "");
        if (activeRightTab === "graph") text = graphCopyText(report);
        if (activeRightTab === "selection") {
          const list = activeListTab === "wallets"
            ? report.display_wallets || report.suspicious_wallets || []
            : activeListTab === "clusters"
            ? report.display_clusters || report.wallet_clusters || []
            : report.display_trades || report.suspicious_trades || [];
          const row = activeListTab === "wallets" ? list.find(item => item.wallet === selectedId) : list.find(item => item.id === selectedId);
          text = selectionCopyText(activeListTab, row);
        }
        if (!text) return;
        await navigator.clipboard.writeText(text);
      }

      const report = boot?.currentReport || null;

      return (
        <div className="app-shell">
          <div className="header">
            <div>
              <div className="title">{boot?.appMeta?.title || "InsPoly Event Forensic Analyzer"}</div>
              <div className="hero">{boot?.appMeta?.hero || "Completed Event Forensic Laboratory"}</div>
            </div>
          </div>

          <div className="content-grid">
            <LeftRail
              filters={filters}
              setFilters={setFilters}
              status={boot?.status || { running: false, stage: "Ready", detail: "Ready", percent: 0 }}
              caseReview={boot?.caseReview || null}
              reviewArtifacts={boot?.reviewArtifacts || null}
              report={report}
              recentRuns={boot?.recentRuns || []}
              resolvedTarget={boot?.resolvedTarget || null}
              onResolveTarget={handleResolveTarget}
              onAnalyze={handleAnalyze}
              onStop={handleStop}
              onOpenRun={handleOpenRun}
              onOpenOutput={handleOpenOutput}
              onOpenExports={handleOpenExports}
              onRunCaseReviewer={handleRunCaseReviewer}
            />
            <MiddleColumn
              activeTab={activeListTab}
              setActiveTab={changeListTab}
              sortMode={sortModes[activeListTab]}
              onSortChange={value => setSortModes(current => ({ ...current, [activeListTab]: value }))}
              report={report}
              status={boot?.status || { running: false }}
              filters={filters}
              setFilters={setFilters}
              selectedId={selectedId}
              onSelect={selectRow}
              onNavigateEntity={handleNavigateEntity}
            />
            <RightPanel
              report={report}
              status={boot?.status || { running: false }}
              activeTab={activeRightTab}
              setActiveTab={setActiveRightTab}
              activeListTab={activeListTab}
              selectedId={selectedId}
              onCopy={handleCopy}
              onNavigateEntity={handleNavigateEntity}
              onClearSelection={clearSelection}
            />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
