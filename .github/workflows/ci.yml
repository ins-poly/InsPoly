name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  offline-validation:
    name: Offline validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall app tools tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run public repository checks
        run: python tools/public_repo_checks.py --all
